<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BÀI 4 – NGỮ PHÁP - Flashcard</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,"Microsoft YaHei",sans-serif;
  background:#fdfbf7;
  display:flex; justify-content:center; color:#202124;
}
.app{width:min(860px,96vw); padding:30px 0 40px}
h1{text-align:center;margin:0 0 15px;font-size:38.4px; font-weight: bold;}
.progress{text-align:center;font-size:21.6px;color:#444;margin-bottom:20px; font-weight: bold;}
.card-wrap{perspective:1200px; cursor:pointer}
.card{
  width:100%; height:640px; position:relative; transform-style:preserve-3d;
  transition:transform .55s ease;
}
.card.flipped{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:24px; background:white; box-shadow:0 15px 45px rgba(0,0,0,.15);
  display:flex; flex-direction:column; padding:36px; border:3px solid #eee; overflow-y:auto;
}
.front{justify-content:flex-start; align-items:flex-start; text-align:left}
.back{transform:rotateY(180deg); text-align:left; align-items:flex-start; justify-content:flex-start; padding-top:40px;}

.hl{color: #7c2d12; font-weight: bold; background-color: #fef08a; padding: 2px 6px; border-radius: 4px; border: 1px solid #eab308;}
.hl-blue { color: #ffffff; font-weight: bold; background-color: #2563eb; padding: 2px 6px; border-radius: 4px; }
.hl-red { color: #dc2626; font-weight: bold; }

.pinyin{
  font-size:1.68em;
  color:#666666;
  margin-bottom:10px;
  font-weight:bold;
  text-align:center;
  width:100%;
}

.zh-front { font-size: 2.16em; font-weight: bold; margin-bottom: 2px; line-height: 1.3; color: #dc2626; text-align: center; width: 100%; }

.zh-back { color: #2563eb; font-weight: bold; font-size: 1.35em; line-height: 1.3; display: inline-block; margin-top: 10px; margin-bottom: 2px; }
.pinyin-back { color: #666666; font-weight: bold; font-size: 1.15em; display: block; margin: 2px 0; }
.vi-back { font-size: 1.15em; color: #333; display: block; margin-bottom: 12px; }

.desc-front { font-size: 1.45em; color: #333; margin: 8px 0; text-align: left; width: 100%; line-height: 1.4; }
.desc { font-size: 1.45em; color: #333; margin: 0; text-align: left; width: 100%; line-height: 1.4; }

.controls{display:flex;gap:20px;justify-content:center;margin-top:30px}
button{
  border:0;border-radius:20px;padding:20px 35px;font-size:26.4px;
  cursor:pointer;background:#e9eef7;color:#233044; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,.1);
}
button.primary{background:#2563eb;color:white}
</style>
</head>

<body>
<div class="app">
  <h1 id="title">BÀI 4 – NGỮ PHÁP</h1>
  <div class="progress" id="progress"></div>

  <div class="card-wrap" id="cardWrap" onclick="flipCard()">
    <div class="card" id="card">
      <div class="face front" id="frontFace"></div>
      <div class="face back" id="backFace"></div>
    </div>
  </div>

  <div class="controls">
    <button onclick="event.stopPropagation();prevCard()">← TRƯỚC</button>
    <button class="primary" onclick="event.stopPropagation();flipCard()">LẬT THẺ</button>
    <button onclick="event.stopPropagation();nextCard()">TIẾP →</button>
  </div>
</div>

       "<span class='zh-back'>你的房東對你好不好？</span><br><span class='pinyin-back'>Nǐ de fángdōng duì nǐ hǎo bù hǎo?</span><span class='vi-back'>(Chủ nhà của cậu đối xử với cậu có tốt không?)</span>" +
       "<span class='zh-back'>醫生對白如玉說別吃冰的、油的東西。</span><br><span class='pinyin-back'>Yīshēng duì Bái Rúyù shuō bié chī bīng de, yóu de dōngxi.</span><span class='vi-back'>(Bác sĩ nói với Bạch Như Ngọc là đừng ăn đồ lạnh, đồ nhiều dầu mỡ.)</span>" +
       "<span class='zh-back'>一個馬安同不認識的人對馬安同笑。</span><br><span class='pinyin-back'>Yí gè Mǎ Āntóng bù rènshi de rén duì Mǎ Āntóng xiào.</span><span class='vi-back'>(Một người mà Mã An Đồng không quen cười với Mã An Đồng.)</span>" +
       "<span class='zh-back'>馬安同對好朋友說「生日快樂！」</span><br><span class='pinyin-back'>Mǎ Āntóng duì hǎo péngyǒu shuō \"shēngrì kuàilè!\"</span><span class='vi-back'>(Mã An Đồng nói với bạn thân \"Chúc mừng sinh nhật!\")</span>" +
       "<span class='zh-back'>語言中心主任對高美玲說明月底才發薪水。</span><br><span class='pinyin-back'>Yǔyán zhōngxīn zhǔrèn duì Gāo Měilíng shuōmíng yuèdǐ cái fā xīnshuǐ.</span><span class='vi-back'>(Chủ nhiệm trung tâm ngôn ngữ giải thích với Cao Mỹ Linh là cuối tháng mới phát lương.)</span>" +
       "</div>"
  }
];

let idx = 0;

function render() {
  document.getElementById('frontFace').innerHTML = cards[idx].f;
  document.getElementById('backFace').innerHTML = cards[idx].b;
  document.getElementById('progress').innerText = `Thẻ ${idx + 1} / ${cards.length}`;
}

function flipCard() {
  document.getElementById('card').classList.toggle('flipped');
}

function nextCard() {
  idx = (idx + 1) % cards.length;
  document.getElementById('card').classList.remove('flipped');
  render();
}

function prevCard() {
  idx = (idx - 1 + cards.length) % cards.length;
  document.getElementById('card').classList.remove('flipped');
  render();
}

document.addEventListener('keydown', function(event) {
  if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
    nextCard();
    event.preventDefault();
  } else if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
    prevCard();
    event.preventDefault();
  } else if (event.key === ' ' || event.key === 'Enter') {
    flipCard();
    event.preventDefault();
  }
});

render();
</script>
</body>
</html>
